<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Summary - PC Building Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-brand">PC Builder</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="assembly.html">Assembly</a>
                <a href="build-summary.html" class="active">Summary</a>
                <a href="troubleshooting.html">Troubleshoot</a>
            </div>
        </div>
    </nav>
    
    <div class="main-container">
        <div class="page-header">
            <h1>Build Summary</h1>
            <p>Review your PC build and power it on</p>
        </div>
        
        <div class="summary-grid">
            <div class="summary-card">
                <h2>Installed Components</h2>
                <div id="build-list" class="component-list"></div>
            </div>
            
            <div class="summary-card">
                <h2>Compatibility Check</h2>
                <div id="compatibility" class="compatibility-status"></div>
            </div>
        </div>
        
        <div class="power-section">
            <button id="power-on-btn" class="btn-power">
                <span class="power-icon">⚡</span>
                Power On PC
            </button>
            <div id="power-result" class="power-result"></div>
        </div>
        
        <div class="action-bar">
            <button id="back-btn" class="btn-secondary">Back to Assembly</button>
            <button id="troubleshoot-btn" class="btn-primary">Troubleshooting Guide</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
